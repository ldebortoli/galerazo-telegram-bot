name: Update runtime and dependencies

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: runtime-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up latest stable Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Align runtime files
        run: python scripts/runtime_versions.py --set-running

      - name: Resolve latest stable dependencies
        run: |
          python -m venv .update-venv
          .update-venv/bin/python -m pip install --upgrade pip
          .update-venv/bin/python -m pip install --upgrade --requirement requirements.in
          .update-venv/bin/python -m pip freeze > requirements.txt

      - name: Validate updated environment
        run: |
          .update-venv/bin/python scripts/runtime_versions.py
          .update-venv/bin/python -m unittest discover -s tests -v
          .update-venv/bin/python -m compileall app.py control_panel.py galerazo_bot
          .update-venv/bin/python -m pip check

      - name: Validate updated Docker image
        run: |
          docker build --tag galerazo-bot:update-test .
          docker run --rm galerazo-bot:update-test python -m unittest discover -s tests -v
          docker run --rm galerazo-bot:update-test python scripts/runtime_versions.py

      - name: Create and merge validated update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Runtime and dependencies are already current."
            exit 0
          fi
          branch="automation/runtime-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add .python-version Dockerfile requirements.txt
          git commit -m "Update Python runtime and dependencies"
          git push --force-with-lease origin "$branch"
          pr_url=$(gh pr create --base main --head "$branch" --title "Update Python runtime and dependencies" --body "Automated stable runtime update. Native and Docker test suites passed before this PR was created." 2>/dev/null || gh pr view "$branch" --json url --jq .url)
          gh pr merge "$pr_url" --squash --delete-branch
