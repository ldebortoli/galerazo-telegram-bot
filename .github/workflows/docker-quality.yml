name: Docker quality

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".python-version"
      - "Dockerfile"
      - "requirements.in"
      - "requirements.txt"
      - "scripts/runtime_versions.py"
      - ".github/workflows/docker-quality.yml"
  workflow_dispatch:

concurrency:
  group: docker-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --target test --tag galerazo-bot:test .

      - name: Run tests in image
        run: docker run --rm galerazo-bot:test python -m pytest

      - name: Verify Docker Python
        run: docker run --rm galerazo-bot:test python scripts/runtime_versions.py

      - name: Build production target
        run: docker build --target runtime --tag galerazo-bot:runtime-test .

      - name: Smoke test production target
        run: docker run --rm galerazo-bot:runtime-test python -c "from galerazo_bot.runtime import ensure_python_version; ensure_python_version(); print('Runtime image version check OK')"
