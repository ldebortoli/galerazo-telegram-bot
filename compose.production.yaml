name: galerazo

services:
  bot:
    image: ${GALERAZO_IMAGE:?Set GALERAZO_IMAGE in deploy/gce/image.env}
    restart: unless-stopped
    init: true
    network_mode: host
    env_file:
      - /etc/galerazo/bot.env
    environment:
      DATABASE_PATH: /app/data/galerazo.sqlite3
      BACKUPS_PATH: /app/backups
    volumes:
      - type: bind
        source: /srv/galerazo/data
        target: /app/data
      - type: bind
        source: /srv/galerazo/backups
        target: /app/backups
      - type: bind
        source: /etc/galerazo/secrets
        target: /app/secrets
        read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
