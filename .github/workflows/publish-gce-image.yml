name: Publish GCE image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag opcional; por defecto usa los primeros 12 caracteres del commit"
        required: false
        type: string

concurrency:
  group: publish-gce-image
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AR_LOCATION: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION }}
      AR_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      AR_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Require main and deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "Run this release workflow from main." >&2
            exit 1
          }
          for name in AR_LOCATION AR_PROJECT AR_REPOSITORY WIF_PROVIDER WIF_SERVICE_ACCOUNT; do
            [[ -n "${!name}" ]] || {
              echo "Missing repository variable: ${name}" >&2
              exit 1
            }
          done

      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        shell: bash
        run: gcloud auth configure-docker "${AR_LOCATION}-docker.pkg.dev" --quiet

      - name: Resolve immutable image tag
        id: image
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_SHA:0:12}}"
          [[ "${tag}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "Invalid image tag: ${tag}" >&2
            exit 1
          }
          image="${AR_LOCATION}-docker.pkg.dev/${AR_PROJECT}/${AR_REPOSITORY}/galerazobot:${tag}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${image}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push runtime target
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record release
        shell: bash
        run: |
          {
            echo "## Galerazo image published"
            echo '```text'
            echo "${{ steps.image.outputs.image }}"
            echo '```'
            echo "Deploy it from the trusted workstation with Deploy-Gce.ps1."
          } >> "${GITHUB_STEP_SUMMARY}"
