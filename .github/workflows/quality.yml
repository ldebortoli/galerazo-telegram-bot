name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up project Python
        uses: actions/setup-python@v6
        with:
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check runtime alignment
        run: python scripts/runtime_versions.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile modules
        run: python -m compileall app.py control_panel.py galerazo_bot

      - name: Check installed dependencies
        run: python -m pip check

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag galerazo-bot:test .

      - name: Run tests in image
        run: docker run --rm galerazo-bot:test python -m unittest discover -s tests -v

      - name: Verify Docker Python
        run: docker run --rm galerazo-bot:test python scripts/runtime_versions.py
